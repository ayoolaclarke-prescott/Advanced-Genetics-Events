<!DOCTYPE html>
<html lang="en">
<head>
<title>Player Application | 2027 Club Basketball Annual Invitational</title>
<meta name="robots" content="noindex,nofollow">

<meta charset="utf-8">
<style>
:root{--navy:#14213D;--orange:#E8590C;--gold:#B9902E;--bg:#F5F6F9;--card:#fff;--ink:#1B2233;--mute:#5E6678;--line:#DDE1EA;--err:#B3261E;--ok:#1E7B45}
*{box-sizing:border-box}
html,body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Roboto,Helvetica,Arial,sans-serif;font-size:16px;line-height:1.45}
.hero{background:var(--navy);color:#fff;padding:28px 16px 22px;border-bottom:5px solid var(--orange)}
.wrap{max-width:720px;margin:0 auto}
.hero small{letter-spacing:.14em;text-transform:uppercase;color:#F4B183;font-weight:600;font-size:12px}
.hero h1{margin:6px 0 4px;font-size:26px;line-height:1.15}
.hero p{margin:0;color:#C8D0E0;font-size:14px}
main{padding:18px 16px 60px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:20px;margin-bottom:16px}
.card h2{margin:0 0 4px;font-size:20px;color:var(--navy)}
.lead{color:var(--mute);margin:0 0 14px;font-size:15px}
.pick{display:block;text-decoration:none;color:inherit;border:2px solid var(--line);border-radius:12px;padding:16px;margin-top:12px;background:#fff}
.pick:hover,.pick:focus{border-color:var(--orange);outline:none}
.pick b{display:block;color:var(--navy);font-size:18px}
.pick span{color:var(--mute);font-size:14px}
.prog{display:flex;gap:4px;margin:0 0 6px}
.prog i{flex:1;height:6px;border-radius:3px;background:var(--line)}
.prog i.on{background:var(--orange)}
.prog i.dn{background:var(--navy)}
.stepname{font-size:13px;color:var(--mute);margin-bottom:10px}
.f{margin:0 0 16px}
label.l{display:block;font-weight:600;margin:0 0 5px;font-size:15px}
label.l .r{color:var(--err)}
.help{font-size:13px;color:var(--mute);margin:4px 0 0}
input[type=text],input[type=tel],input[type=email],input[type=url],input[type=number],input[type=date],input[type=datetime-local],select,textarea{width:100%;padding:11px 12px;font:inherit;border:1.5px solid #C2C8D4;border-radius:8px;background:#fff;color:var(--ink)}
textarea{min-height:84px;resize:vertical}
input:focus,select:focus,textarea:focus{outline:3px solid #F9D2B8;border-color:var(--orange)}
.f.bad input,.f.bad select,.f.bad textarea,.f.bad .drop{border-color:var(--err)}
.msg{color:var(--err);font-size:13px;margin-top:4px;display:none}
.f.bad .msg{display:block}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:6px;cursor:pointer;background:#fff}
.opt input{margin-top:3px;width:18px;height:18px;accent-color:var(--orange);flex:none}
.opt:has(input:checked){border-color:var(--orange);background:#FFF6F0}
.row2,.mrow{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.colorbox{display:flex;align-items:center;gap:10px}
.colorbox input[type=color]{width:54px;height:44px;border:1.5px solid #C2C8D4;border-radius:8px;padding:2px;background:#fff}
.colorbox select{flex:1}
.sw{width:22px;height:22px;border-radius:50%;border:1px solid #999;flex:none}
.heading{font-weight:700;color:var(--navy);margin:20px 0 8px;padding-bottom:4px;border-bottom:2px solid var(--line)}
.info{background:#EEF2FA;border-left:4px solid var(--navy);padding:10px 12px;border-radius:6px;font-size:14px;margin:0 0 16px}
.waiver{background:#FAFAFB;border:1px solid var(--line);border-radius:8px;padding:14px;max-height:220px;overflow:auto;font-size:14px;white-space:pre-wrap;margin-bottom:14px}
.computed{font-size:22px;font-weight:700;color:var(--navy);padding:8px 0}
.drop{display:block;border:2px dashed #AAB2C3;border-radius:10px;padding:16px;text-align:center;background:#FBFBFD;cursor:pointer}
.drop:hover{border-color:var(--orange)}
.drop input{display:none}
.drop .t{font-weight:600;color:var(--navy)}
.drop .s{font-size:13px;color:var(--mute)}
.thumb{margin-top:8px;display:flex;align-items:center;gap:10px;font-size:14px;text-align:left}
.thumb img{width:48px;height:60px;object-fit:cover;border-radius:4px;border:1px solid var(--line)}
.thumb button{margin-left:auto;background:none;border:none;color:var(--err);font:inherit;cursor:pointer}
.nav{display:flex;gap:10px;margin-top:8px}
button.b{flex:1;padding:14px;font:inherit;font-weight:700;border-radius:10px;border:2px solid var(--navy);background:#fff;color:var(--navy);cursor:pointer}
button.b.p{background:var(--orange);border-color:var(--orange);color:#fff}
button.b:disabled{opacity:.6;cursor:wait}
.logos{display:flex;align-items:center;gap:14px;background:#fff;border-radius:12px;padding:10px 14px;margin-bottom:16px;width:max-content;max-width:100%}
.logos img{height:54px;display:block;max-width:100%}
.logos .sep{color:#8A93A6;font-weight:700}
.logos .igph{height:54px;min-width:150px;border:2px dashed #AAB2C3;border-radius:8px;display:flex;align-items:center;justify-content:center;font-size:12px;color:#5E6678;text-align:center;padding:0 10px;line-height:1.2}
.doclist{list-style:none;margin:0 0 14px;padding:0}
.doclist li{display:flex;gap:10px;align-items:flex-start;padding:12px;border:1.5px solid var(--line);border-radius:8px;margin-bottom:8px;background:#fff}
.doclist b{display:block;color:var(--navy)}
.doclist span.d{font-size:14px;color:var(--mute)}
.badge{margin-left:auto;flex:none;font-size:11px;font-weight:700;letter-spacing:.04em;text-transform:uppercase;padding:3px 8px;border-radius:99px;background:#FDE3CF;color:#9A3B06}
.badge.alt{background:#EEF2FA;color:var(--navy)}
.ul{margin:0 0 16px;padding-left:20px}
.foot{margin:6px 0 0;font-size:14px;color:var(--mute);text-align:center}
.foot a{color:var(--navy);font-weight:600}
.pvnote{background:#FFF6CC;border:1px solid #F0DA7A;border-radius:8px;padding:8px 10px;font-size:13px;margin-bottom:12px}
.prog i{cursor:default}
.flyer{padding:0;overflow:hidden}
.flyer img{display:block;width:100%;height:auto;cursor:zoom-in}
.flyer .cap{padding:10px 14px;font-size:13px;color:var(--mute);text-align:center}
.lb{position:fixed;inset:0;background:rgba(10,14,25,.92);z-index:50;overflow:auto;padding:12px;text-align:center;cursor:zoom-out}
.lb img{max-width:100%;height:auto;border-radius:8px}
.hp{position:absolute;left:-9999px;height:0;overflow:hidden}
.done{text-align:center;padding:30px 16px}
.done .id{display:inline-block;margin:10px 0;padding:8px 16px;background:#EEF2FA;border-radius:8px;font-weight:700;font-size:20px;color:var(--navy);letter-spacing:.05em}
.top{margin-bottom:10px;font-size:14px}
.top a{color:var(--navy)}
.err{background:#FDECEA;border:1px solid #F3B8B3;color:var(--err);padding:10px 12px;border-radius:8px;margin-bottom:12px;font-size:14px}
@media(max-width:480px){.row2{grid-template-columns:1fr}.hero h1{font-size:22px}}
.top{display:none}</style>
</head>

function el(tag, attrs, kids) {
  var n = document.createElement(tag);
  for (var k in (attrs || {})) {
    if (k === 'class') n.className = attrs[k];
    else if (k === 'text') n.textContent = attrs[k];
    else if (k.slice(0,2) === 'on') n.addEventListener(k.slice(2), attrs[k]);
    else n.setAttribute(k, attrs[k]);
  }
  (kids || []).forEach(function (c) { if (c) n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
  return n;
}
function today() { var d = new Date(); return d.getFullYear() + '-' + ('0'+(d.getMonth()+1)).slice(-2) + '-' + ('0'+d.getDate()).slice(-2); }

function foot() {
  var list = (CFG.contacts && CFG.contacts.length) ? CFG.contacts : [CFG.contact];
  var kids = [document.createTextNode('Questions? Email ')];
  list.forEach(function (c, i) {
    if (i > 0) kids.push(document.createTextNode(i === list.length - 1 ? ' or ' : ', '));
    if (/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(c)) kids.push(el('a', { href: 'mailto:' + c, text: c }));
    else kids.push(document.createTextNode(c));
  });
  var d = el('div', { class: 'foot' }); kids.forEach(function (k) { d.appendChild(k); }); return d;
}

/* ---------- landing ---------- */
function landing() {
  app.innerHTML = '';
  var c = el('div', { class: 'card' }, [
    el('h2', { text: 'Choose your form' }),
    el('p', { class: 'lead', text: 'Each team registers once. Each player applies once.' }),

    el('a', { class: 'pick', href: BOOT.baseUrl + '?form=player', target: '_top' }, [el('b', { text: 'Player application' }), el('span', { text: 'For each player, or a parent or guardian applying for them.' })])
  ]);
  app.appendChild(c);
  app.appendChild(foot());
}

/* ---------- visibility / values ---------- */
function vis(f) {
  if (!f.show) return true;
  var v = state.data[f.show.k] || '';
  if (f.show.inn) return f.show.inn.indexOf(v) > -1;
  if (f.show.not) return v !== '' && f.show.not.indexOf(v) === -1;
  return true;
}
function isMinor() { var a = Number(state.data.age); return state.data.age !== '' && state.data.age !== undefined && a < 18; }
function req(f) { if (!vis(f)) return false; if (f.req) return true; if (f.reqMinor) return isMinor(); return false; }
function ageFrom(s) {
  var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(s || ''); if (!m) return '';
  var n = new Date(), a = n.getFullYear() - +m[1], md = n.getMonth() + 1 - +m[2];
  if (md < 0 || (md === 0 && n.getDate() < +m[3])) a--;
  return a;
}
function recompute() {
  S.steps.forEach(function (s) { s.fields.forEach(function (f) {
    if (f.t !== 'computed') return;
    if (f.calc === 'age') state.data[f.k] = ageFrom(state.data[f.of[0]]);
    if (f.calc === 'sum') state.data[f.k] = f.of.reduce(function (a, k) { return a + (Number(state.data[k]) || 0); }, 0);
  }); });
}
function save() { try { localStorage.setItem(DKEY, JSON.stringify({ step: state.step, data: state.data })); } catch (e) {} }
function load() { try { var d = JSON.parse(localStorage.getItem(DKEY) || 'null'); if (d) { state.data = d.data || {}; state.step = Math.min(d.step || 0, S.steps.length - 1); } } catch (e) {} }

/* ---------- field widgets ---------- */
function wrapField(f, input, extra) {
  var w = el('div', { class: 'f', 'data-k': f.k || '' });
  if (f.t !== 'check') w.appendChild(el('label', { class: 'l' }, [f.l, req(f) ? el('span', { class: 'r', text: ' *' }) : null]));
  w.appendChild(input);
  if (f.help) w.appendChild(el('div', { class: 'help', text: f.help }));
  w.appendChild(el('div', { class: 'msg', text: 'This field is required.' }));
  return w;
}
function setVal(f, v, rerender) {
  state.data[f.k] = v; recompute(); save();
  if (rerender) render(true);
}
function hasDependents(k) {
  var hit = false;
  S.steps[state.step].fields.forEach(function (f) { if (f.show && f.show.k === k) hit = true; if (f.reqMinor && k === 'dob') hit = true; });
  return hit || k === 'dob' || ['playersCount','staffCount','othersCount'].indexOf(k) > -1;
}

function build(f) {
  var v = state.data[f.k];
  if (v === undefined && f.def) { v = f.def === 'today' ? today() : f.def; state.data[f.k] = v; }
  v = v === undefined ? '' : v;
  var inp;
  switch (f.t) {
    case 'heading': return el('div', { class: 'heading', text: f.l });
    case 'info': return el('div', { class: 'info', text: f.text });
    case 'waiver': return el('div', { class: 'waiver', text: f.text });
    case 'computed':
      return wrapField(Object.assign({}, f, { req: 0 }), el('div', { class: 'computed', 'data-comp': f.k, text: v === '' ? '\u2014' : String(v) }));
    case 'select':
      inp = el('select', { onchange: function (e) { setVal(f, e.target.value, hasDependents(f.k)); } }, [el('option', { value: '', text: 'Select...' })].concat(f.opts.map(function (o) { var op = el('option', { value: o, text: o }); if (o === v) op.selected = true; return op; })));
      return wrapField(f, inp);
    case 'textarea':
      inp = el('textarea', { oninput: function (e) { setVal(f, e.target.value); } }); inp.value = v; return wrapField(f, inp);
    case 'radio':
      inp = el('div', {}, f.opts.map(function (o) {
        var r = el('input', { type: 'radio', name: f.k, value: o, onchange: function () { setVal(f, o, hasDependents(f.k)); } }); if (o === v) r.checked = true;
        return el('label', { class: 'opt' }, [r, el('span', { text: o })]);
      }));
      return wrapField(f, inp);
    case 'checks':
      var cur = v ? v.split(', ') : [];
      inp = el('div', {}, f.opts.map(function (o) {
        var c = el('input', { type: 'checkbox', value: o, onchange: function () {
          var s = state.data[f.k] ? state.data[f.k].split(', ') : []; var i = s.indexOf(o);
          if (c.checked && i < 0) s.push(o); if (!c.checked && i > -1) s.splice(i, 1);
          setVal(f, s.join(', '));
        } }); if (cur.indexOf(o) > -1) c.checked = true;
        return el('label', { class: 'opt' }, [c, el('span', { text: o })]);
      }));
      return wrapField(f, inp);
    case 'check':
      var cb = el('input', { type: 'checkbox', onchange: function () { setVal(f, cb.checked ? 'Yes' : ''); } }); if (v === 'Yes') cb.checked = true;
      var w = el('div', { class: 'f', 'data-k': f.k }, [el('label', { class: 'opt' }, [cb, el('span', { text: f.l })]), el('div', { class: 'msg', text: 'Please tick this box to continue.' })]);
      return w;
    case 'color':
      var sw = el('span', { class: 'sw' }); var pick = el('input', { type: 'color' }); var sel = el('select');
      sel.appendChild(el('option', { value: '', text: 'Pick a colour...' }));
      COLORS.forEach(function (c) { sel.appendChild(el('option', { value: c[1], text: c[0] })); });
      function paint(hex) { sw.style.background = hex; pick.value = hex; }
      function name(hex) { for (var i = 0; i < COLORS.length; i++) if (COLORS[i][1].toLowerCase() === hex.toLowerCase()) return COLORS[i][0]; return 'Custom ' + hex.toUpperCase(); }
      function commit(hex) { paint(hex); setVal(f, name(hex) + ' (' + hex.toUpperCase() + ')'); var m = /\((#[0-9A-F]{6})\)/.exec(state.data[f.k]); sel.value = COLORS.some(function (c) { return c[1].toLowerCase() === hex.toLowerCase(); }) ? hex : ''; }
      var startHex = (/\((#[0-9A-Fa-f]{6})\)/.exec(v) || [0, f.def || '#FFFFFF'])[1];
      paint(startHex); if (!v) state.data[f.k] = name(startHex) + ' (' + startHex.toUpperCase() + ')';
      sel.value = COLORS.some(function (c) { return c[1].toLowerCase() === startHex.toLowerCase(); }) ? startHex : '';
      sel.onchange = function () { if (sel.value) commit(sel.value); };
      pick.oninput = function () { commit(pick.value); };
      return wrapField(f, el('div', { class: 'colorbox' }, [sw, sel, pick]));
    case 'measure':
      return wrapField(f, measure(f, v));
    case 'weight':
      return wrapField(f, weightBox(f));
    case 'file':
      return wrapField(f, fileBox(f));
    default:
      var attrs = { type: f.t === 'datetime' ? 'datetime-local' : f.t, oninput: function (e) { setVal(f, e.target.value, f.k === 'dob' ? false : false); if (f.k === 'dob') updateComputed(); if (['playersCount','staffCount','othersCount'].indexOf(f.k) > -1) updateComputed(); }, onchange: function (e) { if (f.k === 'dob') render(true); } };
      if (f.ph) attrs.placeholder = f.ph;
      if (f.min !== undefined) attrs.min = f.min; if (f.max !== undefined) attrs.max = f.max;
      if (f.t === 'number') attrs.inputmode = 'numeric';
      if (f.t === 'date' && f.k === 'dob') { attrs.max = today(); attrs.min = '1990-01-01'; }
      inp = el('input', attrs); inp.value = v;
      return wrapField(f, inp);
  }
}
function updateComputed() {
  var nodes = document.querySelectorAll('[data-comp]');
  for (var i = 0; i < nodes.length; i++) { var k = nodes[i].getAttribute('data-comp'); var v = state.data[k]; nodes[i].textContent = v === '' || v === undefined ? '\u2014' : String(v); }
}

function measure(f, v) {
  var unit = state.data[f.k + '__u'] || 'ftin';
  var box = el('div');
  function draw() {
    box.innerHTML = '';
    var u = el('select', { onchange: function () { state.data[f.k + '__u'] = u.value; state.data[f.k] = ''; draw(); save(); } }, [el('option', { value: 'ftin', text: 'Feet and inches' }), el('option', { value: 'cm', text: 'Centimetres' })]);
    u.value = unit = state.data[f.k + '__u'] || 'ftin';
    var row = el('div', { class: 'mrow' });
    var a = el('input', { type: 'number', inputmode: 'decimal', placeholder: unit === 'cm' ? 'cm' : 'ft', min: 0, step: 'any' });
    var b = el('input', { type: 'number', inputmode: 'decimal', placeholder: 'in', min: 0, max: 11.99, step: 'any' });
    function upd() {
      var out = '';
      if (unit === 'cm') { if (a.value) out = Math.round(+a.value) + ' cm (' + (+a.value / 2.54 / 12 | 0) + ' ft ' + Math.round((+a.value / 2.54) % 12) + ' in)'; }
      else if (a.value || b.value) { var inch = (+a.value || 0) * 12 + (+b.value || 0); out = (a.value || 0) + ' ft ' + (b.value || 0) + ' in (' + Math.round(inch * 2.54) + ' cm)'; }
      state.data[f.k] = out; state.data[f.k + '__a'] = a.value; state.data[f.k + '__b'] = b.value; save();
    }
    a.value = state.data[f.k + '__a'] || ''; b.value = state.data[f.k + '__b'] || '';
    a.oninput = upd; b.oninput = upd;
    row.appendChild(a); if (unit !== 'cm') row.appendChild(b); else row.style.gridTemplateColumns = '1fr';
    box.appendChild(u); box.appendChild(el('div', { style: 'height:8px' })); box.appendChild(row);
  }
  draw(); return box;
}

function weightBox(f) {
  var box = el('div'), uk = f.k + '__u';
  var u = el('select', { onchange: function () { state.data[uk] = u.value; upd(); } }, [el('option', { value: 'kg', text: 'Kilograms (kg)' }), el('option', { value: 'lb', text: 'Pounds (lbs)' })]);
  u.value = state.data[uk] || 'kg';
  var n = el('input', { type: 'number', inputmode: 'decimal', min: 0, step: 'any', placeholder: 'Weight' });
  n.value = state.data[f.k + '__n'] || '';
  function upd() {
    var unit = u.value, val = n.value;
    state.data[f.k + '__n'] = val; state.data[uk] = unit;
    if (!val) state.data[f.k] = '';
    else if (unit === 'kg') state.data[f.k] = Math.round(+val * 10) / 10 + ' kg (' + Math.round(+val * 2.2046) + ' lb)';
    else state.data[f.k] = Math.round(+val * 10) / 10 + ' lb (' + Math.round(+val / 2.2046) + ' kg)';
    save();
  }
  n.oninput = upd;
  box.appendChild(u); box.appendChild(el('div', { style: 'height:8px' })); box.appendChild(n);
  return box;
}

/* ---------- files ---------- */
function fileBox(f) {
  var input = el('input', { type: 'file', accept: f.exts.map(function (e) { return '.' + e; }).join(',') });
  var info = el('div');
  var drop = el('label', { class: 'drop' }, [el('div', { class: 't', text: 'Tap to choose a file' }), el('div', { class: 's', text: f.exts.join(', ').toUpperCase() + '  |  up to ' + CFG.maxMb + ' MB' }), input]);
  var holder = el('div', {}, [drop, info]);
  function show() {
    info.innerHTML = '';
    var x = state.files[f.k]; if (!x) return;
    var kids = [];
    if (/^image\//.test(x.type) && x.preview) kids.push(el('img', { src: x.preview, alt: '' }));
    kids.push(el('span', { text: x.name + ' (' + Math.round(x.size / 1024) + ' KB)' }));
    kids.push(el('button', { type: 'button', text: 'Remove', onclick: function () { delete state.files[f.k]; input.value = ''; show(); } }));
    info.appendChild(el('div', { class: 'thumb' }, kids));
  }
  input.onchange = function () {
    var file = input.files[0]; if (!file) return;
    var ext = file.name.split('.').pop().toLowerCase();
    if (f.exts.indexOf(ext) < 0) { alert('That file type is not allowed. Use: ' + f.exts.join(', ')); input.value = ''; return; }
    processFile(file, function (res) {
      if (res.size > CFG.maxMb * 1024 * 1024) { alert('That file is over ' + CFG.maxMb + ' MB. Please choose a smaller one.'); input.value = ''; return; }
      state.files[f.k] = res; show(); var w = holder.closest('.f'); if (w) w.classList.remove('bad');
    });
  };
  show(); return holder;
}
function processFile(file, cb) {
  var isImg = /^image\/(png|jpe?g|webp)$/.test(file.type);
  var r = new FileReader();
  r.onload = function () {
    if (!isImg) { var s = String(r.result); cb({ key: null, name: file.name, type: file.type, size: file.size, data: s.split(',')[1] }); return; }
    var img = new Image();
    img.onload = function () {
      var max = 1600, sc = Math.min(1, max / Math.max(img.width, img.height));
      var c = document.createElement('canvas'); c.width = Math.round(img.width * sc); c.height = Math.round(img.height * sc);
      var g = c.getContext('2d'); g.fillStyle = '#fff'; g.fillRect(0, 0, c.width, c.height); g.drawImage(img, 0, 0, c.width, c.height);
      var url = c.toDataURL('image/jpeg', 0.85); var data = url.split(',')[1];
      cb({ name: file.name.replace(/\.\w+$/, '') + '.jpg', type: 'image/jpeg', size: Math.round(data.length * 0.75), data: data, preview: url });
    };
    img.onerror = function () { cb({ name: file.name, type: file.type, size: file.size, data: String(r.result).split(',')[1] }); };
    img.src = r.result;
  };
  r.readAsDataURL(file);
}

/* ---------- render / nav ---------- */
function renderPrep() {
  var P = S.prep;
  app.innerHTML = '';
  if (CFG.flyer) {
    var fl = el('div', { class: 'card flyer' });
    var im = el('img', { src: CFG.flyer, alt: 'Tournament flyer', onclick: function () {
      var lb = el('div', { class: 'lb', onclick: function () { lb.remove(); } }, [el('img', { src: CFG.flyer, alt: 'Tournament flyer' })]);
      document.body.appendChild(lb);
    } });
    fl.appendChild(im); fl.appendChild(el('div', { class: 'cap', text: 'Tap the flyer to view it full size' }));
    app.appendChild(fl);
  }
  var c = el('div', { class: 'card' });
  c.appendChild(el('h2', { text: P.title }));
  c.appendChild(el('p', { class: 'lead', text: P.intro }));
  c.appendChild(el('div', { class: 'heading', text: 'Documents and files to upload' }));
  var ul = el('ul', { class: 'doclist' });
  P.docs.forEach(function (d) {
    ul.appendChild(el('li', {}, [el('div', {}, [el('b', { text: d.n }), el('span', { class: 'd', text: d.d })]), el('span', { class: 'badge' + (d.r === 'Required' ? '' : ' alt'), text: d.r })]));
  });
  c.appendChild(ul);
  c.appendChild(el('div', { class: 'heading', text: 'Information to have ready' }));
  var l = el('ul', { class: 'ul' }); P.info.forEach(function (t) { l.appendChild(el('li', { text: t })); }); c.appendChild(l);
  var facts = [];
  if (CFG.dates) facts.push('Tournament dates: ' + CFG.dates + '.');
  if (CFG.venue) facts.push('Venue: ' + CFG.venue + '.');
  if (facts.length) c.appendChild(el('div', { class: 'info', text: facts.join(' ') }));
  c.appendChild(el('button', { class: 'b p', type: 'button', text: 'Start the form', onclick: function () { state.started = true; render(); window.scrollTo(0, 0); } }));
  app.appendChild(c); app.appendChild(foot());
  window.scrollTo(0, 0);
}

function render(keepScroll) {
  if (!state.started) { renderPrep(); return; }
  recompute();
  var y = window.scrollY;
  app.innerHTML = '';
  var step = S.steps[state.step];
  var top = el('div', { class: 'top' }, [el('a', { href: BOOT.baseUrl, target: '_top', text: 'Back to form list' })]);
  app.appendChild(top);
  var c = el('div', { class: 'card' });
  var prog = el('div', { class: 'prog' }); S.steps.forEach(function (s, i) {
    var seg = el('i', { class: i < state.step ? 'dn' : i === state.step ? 'on' : '' });
    if (PREVIEW) { seg.style.cursor = 'pointer'; seg.title = 'Jump to step ' + (i + 1); seg.onclick = function () { state.step = i; render(); }; }
    prog.appendChild(seg);
  });
  c.appendChild(prog);
  c.appendChild(el('div', { class: 'stepname', text: 'Step ' + (state.step + 1) + ' of ' + S.steps.length }));
  c.appendChild(el('h2', { text: step.title }));
  if (PREVIEW && state.step === 0) c.appendChild(el('div', { class: 'pvnote', text: 'Preview mode: required fields can be skipped. Tap the progress bars to jump between steps.' }));
  if (state.step === 0) c.appendChild(el('p', { class: 'lead', text: S.intro }));
  step.fields.forEach(function (f) { if (vis(f)) c.appendChild(build(f)); });
  c.appendChild(el('div', { class: 'hp' }, [el('input', { type: 'text', tabindex: '-1', autocomplete: 'off', id: 'hp' })]));
  var errBox = el('div', { class: 'err', id: 'errbox', style: 'display:none' });
  c.appendChild(errBox);
  var nav = el('div', { class: 'nav' });
  if (state.step > 0) nav.appendChild(el('button', { class: 'b', type: 'button', text: 'Back', onclick: function () { state.step--; save(); render(); window.scrollTo(0, 0); } }));
  var last = state.step === S.steps.length - 1;
  var nx = el('button', { class: 'b p', type: 'button', id: 'nx', text: last ? 'Submit' : 'Continue', onclick: function () { next(last); } });
  nav.appendChild(nx); c.appendChild(nav);
  app.appendChild(c);
  app.appendChild(foot());
  window.scrollTo(0, keepScroll ? y : 0);
}

function validateStep() {
  var bad = null;
  S.steps[state.step].fields.forEach(function (f) {
    if (!f.k || f.t === 'computed') return;
    var w = app.querySelector('.f[data-k="' + f.k + '"]'); if (!w) return;
    var ok = true, v = state.data[f.k];
    if (req(f)) {
      if (f.t === 'file') ok = !!state.files[f.k];
      else ok = v !== undefined && v !== '' && v !== null;
    }
    if (ok && v && f.t === 'email') ok = /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v);
    if (ok && v && f.t === 'number' && f.min !== undefined) ok = Number(v) >= f.min && (f.max === undefined || Number(v) <= f.max);
    w.classList.toggle('bad', !ok);
    if (!ok && !bad) bad = w;
  });
  if (!bad && TYPE === 'club' && state.step === 3) {
    var a = state.data.arrival, d = state.data.departure;
    if (a && d && d <= a) { showErr('Departure must be after arrival.'); return false; }
  }
  if (!bad && TYPE === 'player' && state.step === 1 && state.data.dob && Number(state.data.age) > 25) { showErr('Please check the date of birth.'); return false; }
  if (!bad && TYPE === 'player' && state.step === S.steps.length - 1 && isMinor() && /^Player/.test(state.data.signedBy || '')) { showErr('Players under 18 need a parent or guardian to sign.'); return false; }
  if (bad) { bad.scrollIntoView({ behavior: 'smooth', block: 'center' }); showErr('Please fix the highlighted fields.'); return false; }
  hideErr(); return true;
}
function showErr(m) { var b = document.getElementById('errbox'); if (b) { b.textContent = m; b.style.display = 'block'; } }
function hideErr() { var b = document.getElementById('errbox'); if (b) b.style.display = 'none'; }

function next(last) {
  if (!PREVIEW && !validateStep()) return;
  if (!last) { state.step++; save(); render(); return; }
  submit();
}

function submit() {
  var btn = document.getElementById('nx'); btn.disabled = true; btn.textContent = 'Submitting, please wait...';
  var data = {}; Object.keys(state.data).forEach(function (k) { if (k.indexOf('__') < 0) data[k] = state.data[k]; });
  data._hp = document.getElementById('hp').value;
  // drop answers hidden by conditions
  S.steps.forEach(function (s) { s.fields.forEach(function (f) { if (f.k && !vis(f)) data[f.k] = ''; }); });
  var files = Object.keys(state.files).filter(function (k) {
    var f = null; S.steps.forEach(function (s) { s.fields.forEach(function (x) { if (x.k === k) f = x; }); }); return f && vis(f);
  }).map(function (k) { var x = state.files[k]; return { key: k, name: x.name, type: x.type, data: x.data }; });
  google.script.run
    .withSuccessHandler(function (res) {
      if (res && res.ok) { try { localStorage.removeItem(DKEY); } catch (e) {} thanks(res.id); }
      else { btn.disabled = false; btn.textContent = 'Submit'; showErr((res && res.error) || 'Something went wrong. Please try again.'); }
    })
    .withFailureHandler(function (err) {
      btn.disabled = false; btn.textContent = 'Submit';
      showErr('Could not reach the server. Check your connection and try again. Your answers are still here.');
    })
    .submitForm(TYPE, data, files);
}

function thanks(id) {
  app.innerHTML = '';
  var who = TYPE === 'club' ? 'registration' : 'application';
  app.appendChild(el('div', { class: 'card done' }, [
    el('h2', { text: 'Thank you. We have your ' + who + '.' }),
    el('div', { class: 'id', text: id }),
    el('p', { class: 'lead', text: 'Keep this reference. The organisers will review it and email you the next steps, including payment details for the administrative fee. Use the email addresses below if you have questions.' }),
    el('p', {}, [el('a', { href: BOOT.baseUrl, target: '_top', text: TYPE === 'club' ? 'Register another team' : 'Submit another player' })])
  ]));
  app.appendChild(foot());
  window.scrollTo(0, 0);
}

/* ---------- boot ---------- */
if (!TYPE || !S) landing();
else {
  load();
  if (!/(draft)/.test('')) { }
  render();
}
</script>
